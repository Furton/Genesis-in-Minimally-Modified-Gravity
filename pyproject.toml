[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vcdm-genesis"
version = "1.0.0"
description = "Numerical scan, analytic fit and figures for the scalar and tensor spectra of Genesis in Minimally Modified Gravity (VCDM)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "mpmath>=1.3"]

[tool.setuptools]
packages = ["vcdm_genesis", "vcdm_genesis.figures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
